[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kra-racing-analytics"
version = "0.1.0"
description = "Python and DuckDB analytics pipeline for KRA OpenAPI data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4,<2",
    "httpx>=0.28,<1",
    "joblib>=1.4,<2",
    "numpy>=2,<3",
    "pandas>=2.3,<3",
    "python-dotenv>=1.1,<2",
    "scikit-learn>=1.7,<2",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.4,<5",
    "ipykernel>=6.29,<8",
    "matplotlib>=3.10,<4",
    "mypy>=1.17,<2",
    "pandas-stubs>=2.3,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
kra-analytics = "kra_analytics.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kra_analytics"]
